# ===== Application =====
spring.application.name=splitwise-pro

# ===== Database (Supports H2 locally and PostgreSQL on Render) =====
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:splitdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.database-platform=${DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
app.jwt.secret=SplitWiseProSecretKey2024!@#$%^&*()VeryLongSecretKeyForJWT
app.jwt.expiration=86400000

# ===== CORS =====
app.cors.allowed-origins=http://localhost:3000,https://splitwise-pro.netlify.app

# ===== Logging =====
logging.level.com.splitwisepro=DEBUG
logging.level.org.springframework.security=INFO

# ===== Server =====
server.port=8080

# ===== Swagger =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
